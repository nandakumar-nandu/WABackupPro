# Enable parallel builds
org.gradle.parallel=true

# Enable caching
org.gradle.caching=true

# Configure JVM options for compilation speed
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX refactoring flag
android.useAndroidX=true
android.enableJetifier=true

# Kotlin style guide
kotlin.code.style=official

# Suppress AGP warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
